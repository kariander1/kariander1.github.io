<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch A1 Flashcards</title>
<meta name="description" content="German A1 vocabulary flashcards with English and Hebrew translations, pronunciation and example sentences.">
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e1da;
  --accent: #0a7a8a; --accent-ink: #ffffff;
  --der: #2563eb; --die: #dc2626; --das: #16a34a;
  --good: #16a34a; --bad: #dc2626; --chip: #efece5;
  --shadow: 0 10px 30px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --surface: #1f1f23; --ink: #f2f2f4; --muted: #9a9aa2; --line: #2e2e34;
    --accent: #2cb5c7; --accent-ink: #0b1517;
    --der: #6b9cff; --die: #ff6b6b; --das: #4ade80; --chip: #2a2a30;
    --shadow: 0 10px 30px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans Hebrew", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h1 .flag { display: inline-block; width: 22px; height: 15px; vertical-align: -1px; margin-inline-end: 8px; border-radius: 2px;
  background: linear-gradient(#000 0 33.3%, #dd0000 33.3% 66.6%, #ffce00 66.6%); }
.home { color: var(--muted); font-size: 14px; text-decoration: none; }
.home:hover { color: var(--accent); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

details.cats { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
details.cats summary { cursor: pointer; font-size: 14px; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
details.cats summary::-webkit-details-marker { display: none; }
details.cats summary b { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 999px; cursor: pointer; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip small { opacity: .75; margin-inline-start: 4px; }
.chip-actions { display: flex; gap: 12px; margin-top: 8px; font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; padding: 0; cursor: pointer; }

.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.bar { flex: 1; height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--good); width: 0; transition: width .3s; }

.card-area { perspective: 1200px; }
.card { position: relative; min-height: 320px; cursor: pointer; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; text-align: center; }
.face.back { transform: rotateY(180deg); }
.cat-tag { position: absolute; top: 14px; inset-inline-start: 16px; font-size: 12px; color: var(--muted); }
.hint { position: absolute; bottom: 12px; font-size: 12px; color: var(--muted); }
.word { font-size: clamp(28px, 7vw, 42px); font-weight: 700; line-height: 1.2; letter-spacing: -.01em; word-break: break-word; }
.word.small { font-size: clamp(22px, 5.5vw, 30px); }
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
.sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
.example { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); width: 100%; max-width: 520px; font-size: 15px; }
.example .de { font-weight: 600; }
.example .tr { color: var(--muted); margin-top: 2px; }
.speak { border: 1px solid var(--line); background: var(--chip); color: var(--ink); width: 34px; height: 34px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; vertical-align: middle; margin-inline-start: 8px; padding: 0; }
.speak:hover { border-color: var(--accent); color: var(--accent); }
.speak svg { width: 16px; height: 16px; }
.speak.sm { width: 26px; height: 26px; } .speak.sm svg { width: 13px; height: 13px; }
[dir=rtl] .speak svg { transform: scaleX(-1); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.btn { border: 0; font: inherit; font-weight: 600; font-size: 16px; padding: 14px; border-radius: 14px; cursor: pointer; }
.btn.again { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); }
.btn.got { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:active { transform: scale(.98); }

.quiz-q { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 28px 20px; text-align: center; position: relative; }
.options { display: grid; gap: 8px; margin-top: 14px; }
.opt { text-align: start; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; padding: 13px 16px; border-radius: 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.opt .k { color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.opt:disabled { cursor: default; }
.score { display: flex; justify-content: center; gap: 18px; font-size: 14px; color: var(--muted); margin-top: 12px; }

.done { text-align: center; padding: 40px 20px; background: var(--surface); border-radius: 20px; border: 1px solid var(--line); }
.done h2 { margin: 0 0 8px; }
.legend { display: flex; justify-content: center; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 18px; }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
.keys { display: none; } @media (hover: hover) { .keys { display: block; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1><span class="flag"></span><span data-i="title"></span></h1>
    <a class="home" href="../">← kariander1</a>
  </header>

  <div class="controls">
    <div class="seg" id="langSeg">
      <button data-v="en">English</button><button data-v="he">עברית</button>
    </div>
    <div class="seg" id="dirSeg">
      <button data-v="de" data-i="dirDe"></button><button data-v="tr" data-i="dirTr"></button>
    </div>
    <div class="seg" id="modeSeg">
      <button data-v="cards" data-i="cards"></button><button data-v="quiz" data-i="quiz"></button>
    </div>
  </div>

  <details class="cats" id="cats">
    <summary><span data-i="topics"></span><b id="catSummary"></b></summary>
    <div class="chips" id="chips"></div>
    <div class="chip-actions">
      <button class="linkbtn" id="allBtn" data-i="all"></button>
      <button class="linkbtn" id="noneBtn" data-i="none"></button>
      <button class="linkbtn" id="resetBtn" data-i="reset" style="margin-inline-start:auto;color:var(--muted)"></button>
    </div>
  </details>

  <div class="progress"><span id="progText"></span><div class="bar"><div id="progBar"></div></div></div>

  <main id="stage"></main>

  <div class="legend"><span class="art-der">der</span><span class="art-die">die</span><span class="art-das">das</span></div>
  <footer>
    <div class="keys" data-i="keys"></div>
    <div data-i="credit"></div>
  </footer>
</div>

<script src="words.js"></script>
<script src="examples1.js"></script>
<script src="examples2.js"></script>
<script src="examples3.js"></script>
<script src="app.js"></script>
</body>
</html>
